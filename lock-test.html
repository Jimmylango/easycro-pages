<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Post picker (locked)</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f4ef radial-gradient(circle at 1px 1px,#dcd9ce 1px,transparent 1.5px) 0 0/18px 18px;font:500 15px/1.5 -apple-system,system-ui,sans-serif;color:#131313}
form{background:#fff;border:1px solid #e3e1d9;border-radius:22px;padding:28px;width:min(360px,90vw);display:grid;gap:12px;box-shadow:0 18px 40px -18px rgba(19,19,19,.25)}
.wm{font-weight:800;font-size:24px;letter-spacing:-.05em}.wm span{color:#2b54ff}
input{font:500 16px/1 inherit;padding:14px 16px;border:1.5px solid #e3e1d9;border-radius:999px;background:#f5f4ef;outline:none}input:focus{border-color:#2b54ff;background:#fff}

.err{color:#e8412a;font-size:13px;min-height:18px;margin:0}
</style></head><body>
<form id="f"><div class="wm">easy<span>cro</span></div><div>Post picker is locked.</div>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
<button>Unlock</button><p class="err" id="e"></p></form>
<script>
var D={s:"XrZu9Fk7ZYCG+gbO0q1S5w==",i:"m7P8C5Rx+bZZNe72",c:"LFl+rGu3t+WFSatUxTZNes/pva2riyuiLxb+hsjnVnqaPEmSoly/M3akOIgpQ4dLohuxElup+OGJj8Mw2vol7IVNlzTV2DsCfNlV4vN/MVMRHeXnm0BXnhIFAnoBi4XUl8rv9YvjG7+8UlHeLX/dhEBqDS4PXdaKbVAMfUOmtIDhzK4GUyenDk2/BhHgEAy4Zyi7zX9aXKTdiIuHsZcs5FLyOz5p36/L6U42WQIvJW7AxfI=",n:310000};
function u(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0);});}
async function open(pw){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit',function(ev){ ev.preventDefault();
  var b=this.querySelector('button'); b.textContent='Unlocking...';
  open(document.getElementById('pw').value).catch(function(){ b.textContent='Unlock'; document.getElementById('e').textContent='Wrong password.'; });
});
</script></body></html>
